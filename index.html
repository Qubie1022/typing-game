<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>字雨 · 打字遊戲</title>
<style>
:root{--bg1:#0b0f1f;--bg2:#05060d;--fg:#e8ecff;--accent:#7c5cff;--accent2:#22d3ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 30%,var(--bg1),var(--bg2) 70%);color:var(--fg);
font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.stage{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5rem;text-align:center;padding:1rem}
h1{margin:0;font-size:clamp(3rem,12vw,6.5rem);font-weight:800;letter-spacing:.12em;
background:linear-gradient(120deg,var(--accent2),var(--accent) 50%,#ff6ec7);-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 0 24px rgba(124,92,255,.55));animation:float 4s ease-in-out infinite}
.sub{margin:-1.5rem 0 0;letter-spacing:.5em;font-size:clamp(.8rem,2.5vw,1.1rem);color:#8f98c9}
button{font:inherit;font-size:1.25rem;font-weight:700;letter-spacing:.3em;color:#fff;cursor:pointer;
padding:1rem 3.2rem;border-radius:999px;border:1px solid rgba(255,255,255,.25);
background:linear-gradient(120deg,var(--accent),var(--accent2));
box-shadow:0 0 30px rgba(124,92,255,.5),inset 0 0 12px rgba(255,255,255,.15);
transition:transform .2s,box-shadow .2s;animation:pulse 2.4s ease-in-out infinite}
button:hover{transform:scale(1.06);box-shadow:0 0 50px rgba(34,211,238,.7),inset 0 0 12px rgba(255,255,255,.25)}
button:active{transform:scale(.97)}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes pulse{50%{box-shadow:0 0 48px rgba(34,211,238,.6),inset 0 0 12px rgba(255,255,255,.15)}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="stage">
  <h1>字雨</h1>
  <p class="sub">TYPING RAIN</p>
  <button id="start">開始遊戲</button>
</div>
<script>
// 背景:緩慢飄落的半透明字母,營造氛圍
const c=document.getElementById('bg'),x=c.getContext('2d');
let W,H,ps=[];
function resize(){W=c.width=innerWidth;H=c.height=innerHeight;
ps=Array.from({length:Math.floor(W/45)},()=>mk(true))}
function mk(r){return{x:Math.random()*W,y:r?Math.random()*H:-30,s:.3+Math.random()*.7,
z:16+Math.random()*22,ch:String.fromCharCode(65+Math.floor(Math.random()*26)),a:.08+Math.random()*.2}}
function draw(){x.clearRect(0,0,W,H);
for(const p of ps){p.y+=p.s;if(p.y>H+30)Object.assign(p,mk(false));
x.font=`700 ${p.z}px monospace`;x.fillStyle=`rgba(140,160,255,${p.a})`;x.fillText(p.ch,p.x,p.y)}
requestAnimationFrame(draw)}
addEventListener('resize',resize);resize();draw();
document.getElementById('start').addEventListener('click',()=>{/* 第二階段:在這裡開始遊戲 */});
</script>
</body>
</html>
